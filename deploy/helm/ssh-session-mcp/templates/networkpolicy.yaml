{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ssh-session-mcp.fullname" . }}
  labels:
    {{- include "ssh-session-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ssh-session-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.networkPolicy.allowIngressNamespaces }}
        {{- range .Values.networkPolicy.allowIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- else }}
        - {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    - to:
        {{- if .Values.networkPolicy.allowEgressCidrs }}
        {{- range .Values.networkPolicy.allowEgressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- else }}
        - {}
        {{- end }}
{{- end }}
