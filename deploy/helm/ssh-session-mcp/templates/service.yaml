apiVersion: v1
kind: Service
metadata:
  name: {{ include "ssh-session-mcp.fullname" . }}
  labels:
    {{- include "ssh-session-mcp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ssh-session-mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: viewer
      port: {{ .Values.service.port }}
      targetPort: viewer
