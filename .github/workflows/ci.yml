name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version consistency
        run: npm run version:check

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Validate repository contract
        run: npm run validate:repo

      - name: Build GitHub Pages site
        run: npm run build:site

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ssh-session-mcp:ci
          push: false
          load: true

      - name: Smoke test container health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ssh-session-mcp-ci \
            -e SSH_MCP_LOCAL=1 \
            -e VIEWER_PORT=8793 \
            -e VIEWER_HOST=0.0.0.0 \
            -p 8793:8793 \
            ssh-session-mcp:ci

          trap 'docker logs ssh-session-mcp-ci || true; docker rm -f ssh-session-mcp-ci || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8793/readyz >/tmp/ssh-mcp-readyz.json; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8793/livez >/tmp/ssh-mcp-livez.json
          curl --fail --silent http://127.0.0.1:8793/metrics >/tmp/ssh-mcp-metrics.txt
          grep -q '"ok": true' /tmp/ssh-mcp-readyz.json
          grep -q 'ssh_session_mcp_up 1' /tmp/ssh-mcp-metrics.txt
