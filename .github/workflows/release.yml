name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -pe "JSON.parse(require('fs').readFileSync('./package.json', 'utf8')).version")
          SERVER_JSON_VERSION=$(node -pe "JSON.parse(require('fs').readFileSync('./server.json', 'utf8')).version")
          echo "tag=$TAG_VERSION"
          echo "package.json=$PACKAGE_VERSION"
          echo "server.json=$SERVER_JSON_VERSION"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
          test "$TAG_VERSION" = "$SERVER_JSON_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Verify version consistency
        run: npm run version:check

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Validate repository contract
        run: npm run validate:repo

      - name: Build static site
        run: npm run build:site

      - name: Install Helm
        shell: bash
        run: |
          set -euo pipefail
          HELM_VERSION="v3.16.3"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o helm.tgz
          tar -xzf helm.tgz
          sudo mv linux-amd64/helm /usr/local/bin/helm

      - name: Validate Helm chart renders and Kubernetes manifests
        run: npm run validate:helm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check whether Docker Hub secrets are configured
        id: dockerhub
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Skip Docker Hub publish when secrets are missing
        if: steps.dockerhub.outputs.enabled != 'true'
        run: echo "Skipping Docker Hub publish because DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not configured."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        id: docker-meta-hub
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_USERNAME }}/ssh-session-mcp
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and publish Docker Hub image
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta-hub.outputs.tags }}
          labels: ${{ steps.docker-meta-hub.outputs.labels }}

      - name: Extract Docker metadata for GHCR
        id: docker-meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and publish GHCR image
        id: ghcr-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta-ghcr.outputs.tags }}
          labels: ${{ steps.docker-meta-ghcr.outputs.labels }}

      - name: Install Trivy
        shell: bash
        run: bash ./scripts/install-trivy.sh

      - name: Run Trivy filesystem scan
        shell: bash
        run: |
          set -euo pipefail
          trivy fs . \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1

      - name: Run Trivy image scan against GHCR release image
        shell: bash
        run: |
          set -euo pipefail
          trivy image "ghcr.io/${GITHUB_REPOSITORY}@${{ steps.ghcr-build.outputs.digest }}" \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1

      - name: Install Syft
        shell: bash
        run: |
          set -euo pipefail
          SYFT_VERSION="v1.17.0"
          curl -fsSL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" -o syft.tgz
          tar -xzf syft.tgz syft
          sudo mv syft /usr/local/bin/syft

      - name: Generate SBOM for published image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          DIGEST="${{ steps.ghcr-build.outputs.digest }}"
          SHORT_DIGEST="${DIGEST#sha256:}"
          SHORT_DIGEST="${SHORT_DIGEST:0:12}"
          syft "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}" -o cyclonedx-json > "release-assets/${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME}-sbom-${SHORT_DIGEST}.cyclonedx.json"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign GHCR image digest with keyless Cosign
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign "ghcr.io/${GITHUB_REPOSITORY}@${{ steps.ghcr-build.outputs.digest }}"

      - name: Smoke test distributed mode with Redis
        shell: bash
        run: |
          set -euo pipefail
          docker network create ssh-mcp-release-net
          docker run -d --name ssh-mcp-redis --network ssh-mcp-release-net redis:7-alpine
          docker run -d --name ssh-session-mcp-distributed --network ssh-mcp-release-net \
            -e SSH_MCP_LOCAL=1 \
            -e VIEWER_PORT=8794 \
            -e VIEWER_HOST=0.0.0.0 \
            -e SSH_MCP_RUNTIME_MODE=distributed \
            -e SSH_MCP_STORE=redis \
            -e SSH_MCP_REDIS_URL=redis://ssh-mcp-redis:6379/0 \
            -e SSH_MCP_NODE_ID=release-node-a \
            -e SSH_MCP_PUBLIC_BASE_URL=https://ssh-mcp.example.com \
            -e SSH_MCP_AUTH_MODE=proxy \
            -e SSH_MCP_TRUST_PROXY=true \
            -p 8794:8794 \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

          trap 'docker logs ssh-session-mcp-distributed || true; docker logs ssh-mcp-redis || true; docker rm -f ssh-session-mcp-distributed ssh-mcp-redis || true; docker network rm ssh-mcp-release-net || true' EXIT

          for attempt in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:8794/readyz >/tmp/ssh-mcp-distributed-readyz.json; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8794/metrics >/tmp/ssh-mcp-distributed-metrics.txt
          grep -q '"distributedMode": true' /tmp/ssh-mcp-distributed-readyz.json
          grep -q '"distributedStoreReachable": true' /tmp/ssh-mcp-distributed-readyz.json
          docker exec ssh-mcp-redis redis-cli --scan --pattern 'ssh-session-mcp:nodes:*' | grep -q 'ssh-session-mcp:nodes:release-node-a'

      - name: Publish to npm with Trusted Publishing
        run: npm publish --access public --provenance

      - name: Package npm tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          tar -czf "release-assets/${GITHUB_REPOSITORY##*/}-site.tar.gz" -C dist .

      - name: Select release notes
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" release-notes.md
          else
            {
              echo "# ${GITHUB_REF_NAME}"
              echo
              echo "Automated release for ${GITHUB_REF_NAME}."
            } > release-notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            release-assets/*
