name: Gitee Sync

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitee-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

    steps:
      - name: Check whether Gitee secrets are configured
        id: config
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${GITEE_USERNAME:-}" ] && [ -n "${GITEE_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when Gitee secrets are missing
        if: steps.config.outputs.enabled != 'true'
        run: echo "Skipping Gitee sync because GITEE_USERNAME or GITEE_TOKEN is not configured."

      - name: Checkout
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        if: steps.config.outputs.enabled == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add gitee remote
        if: steps.config.outputs.enabled == 'true'
        run: |
          git remote add gitee-sync "https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/Zw-awa/ssh-session-mcp.git"

      - name: Sync branch or tag to Gitee
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            git push gitee-sync "HEAD:${GITHUB_REF_NAME}" --force
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git push gitee-sync "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" --force
          else
            echo "Unsupported ref type: ${GITHUB_REF_TYPE}"
            exit 1
          fi
