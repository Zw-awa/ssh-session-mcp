services:
  ssh-session-mcp:
    image: ${SSH_SESSION_MCP_IMAGE:-docker.io/zwawa/ssh-session-mcp:latest}
    container_name: ssh-session-mcp-env
    restart: unless-stopped
    stdin_open: true
    tty: false
    ports:
      - "8793:8793"
    environment:
      VIEWER_PORT: "8793"
      VIEWER_HOST: "0.0.0.0"
      AUTO_OPEN_TERMINAL: "false"
      SSH_HOST: "${SSH_HOST}"
      SSH_PORT: "${SSH_PORT:-22}"
      SSH_USER: "${SSH_USER}"
      SSH_PASSWORD: "${SSH_PASSWORD:-}"
